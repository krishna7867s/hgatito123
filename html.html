<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Style Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" aria-hidden="true"></div>
    <div class="page-shell">
        <div class="hero-panel">
            <h1 class="heading">Calculadora :3</h1>
            <p class="subheading">(๑•᎑•๑)</p>
        </div>
        <div class="calculator" role="application" aria-label="Calculadora" >
            <div class="screen" id="display" aria-live="polite">0</div>
            <div class="buttons">
                <button class="button ac" data-action="clear">AC</button>
                <button class="button" data-action="delete">⌫</button>
                <button class="button" data-action="operator">%</button>
                <button class="button" data-action="operator">÷</button>

                <button class="button number" data-action="digit" data-value="7"><span class="icon"></span>7</button>
                <button class="button number" data-action="digit" data-value="8"><span class="icon"></span>8</button>
                <button class="button number" data-action="digit" data-value="9"><span class="icon"></span>9</button>
                <button class="button" data-action="operator">×</button>

                <button class="button number" data-action="digit" data-value="4"><span class="icon"></span>4</button>
                <button class="button number" data-action="digit" data-value="5"><span class="icon"></span>5</button>
                <button class="button number" data-action="digit" data-value="6"><span class="icon"></span>6</button>
                <button class="button" data-action="operator">−</button>

                <button class="button number" data-action="digit" data-value="1"><span class="icon"></span>1</button>
                <button class="button number" data-action="digit" data-value="2"><span class="icon"></span>2</button>
                <button class="button number" data-action="digit" data-value="3"><span class="icon"></span>3</button>
                <button class="button" data-action="operator">+</button>

                <button class="button number" data-action="digit" data-value="0"><span class="icon"></span>0</button>
                <button class="button" data-action="digit" data-value="."><span class="icon"></span>.</button>
                <button class="button equal" data-action="calculate">=</button>
            </div>
        </div>
    </div>

    <audio id="miau-sound" src="data:audio/wav;base64,UklGRngAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=" preload="auto"></audio>
    <script src="script.js" defer></script>
</body>
</html>
